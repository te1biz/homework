[tool.poetry]
name = "pythonproject2"
version = "0.1.0"
description = "Homework project for processing bank transactions"
authors = ["te1biz <telbiz9867@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.34.2"
python-dotenv = "^1.2.4"
openpyxl = "^3.1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint =[
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "pytest (>=9.1.1,<10.0.0)"]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)",
    "types-requests (>=2.33.0.20261006,<3.0.0.0)",
    "types-openpyxl (>=3.1.5.20260827,<4.0.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | dist
  | foo\.py
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = '(\.venv|venv)'
