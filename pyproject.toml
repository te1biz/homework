[tool.poetry]
name = "pythonproject2"
version = "0.1.0"
description = "Homework project for processing bank transactions"
authors = ["te1biz <telbiz9867@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.34.2"
python-dotenv = "^1.2.4"
pandas = "^3.0.6"
openpyxl = "^3.1.5"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^2.3.1"
black = "^26.5.1"
isort = "^9.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
types-requests = "^2.33.0"
pandas-stubs = "^3.0.5"
autopep8 = "^2.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | dist
  | foo\.py
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = '(\.venv|venv)'
